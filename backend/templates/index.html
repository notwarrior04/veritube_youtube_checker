{% extends "base.html" %}
{% block title %}VeriTube - Fact Checker for YouTube Video{% endblock %}
{% block content %}
  <div class="row justify-content-center mt-5">
    <div class="col-lg-8">
      <div class="card-nb p-4 p-md-5" id="main-card">
        <h1 class="h3 mb-3">Verify a YouTube Video</h1>
        <p class="text-secondary mb-4">Paste a video link to download audio, transcribe, fact‑check, and generate structural summaries.</p>
        <form id="analyze-form" action="{{ url_for('analyze') }}" method="post" class="d-flex flex-column flex-sm-row gap-3" onsubmit="
          let btn = document.getElementById('submit-btn');
          let card = document.getElementById('main-card');
          if (card) card.classList.add('card-scanning-nb');
          if (btn) {
            btn.classList.add('btn-nb-active-anim');
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<span class=\'vt-radar-spinner me-2\'></span> ANALYZING VIDEO...';
          }
        ">
          <input name="url" type="url" class="form-control input-nb" placeholder="Enter any YouTube Video URL" required>
          <button id="submit-btn" type="submit" class="btn btn-nb text-nowrap">Analyze Video</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
